version: '3.8'

services:
  # serviço da aplicação Node.js
  server:
    build: ./server
    container_name: deckdex-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      - db
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

  # serviço do bd PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: deckdex-db
    restart: always
    env_file:
      - ./server/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # - ./server/database/:/docker-entrypoint-initdb.d/

volumes:
  pgdata: